<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Pluto - Discontinued</title>
    <link rel="shortcut icon" type="image/png" href="/static/favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            color: #333;
        }
        .card {
            max-width: 560px;
            width: 90%;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .banner {
            background: #d4380d;
            color: #fff;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
        }
        .banner svg {
            flex-shrink: 0;
        }
        .content {
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .content h1 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
            color: #1a1a1a;
        }
        .content p {
            font-size: 1rem;
            line-height: 1.7;
            color: #555;
            margin-bottom: 0.75rem;
        }
        .content p:last-child {
            margin-bottom: 0;
        }
        .divider {
            border: none;
            border-top: 1px solid #e8e8e8;
            margin: 1.25rem 0;
        }
        .contact-section {
            background: #fafafa;
            border-top: 1px solid #e8e8e8;
            padding: 1.25rem 1.5rem;
            text-align: center;
            font-size: 0.95rem;
            color: #666;
            line-height: 1.6;
        }
        a {
            color: #005689;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="banner">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Service Discontinued
    </div>
    <div class="content">
        <h1>Pluto has been retired</h1>
        <p>Pluto is no longer in service and has been replaced by a new system.</p>
        <p>Please use <strong>Project Launcher</strong> to create new projects.</p>
    </div>
    <div class="contact-section">
        Need help or training on the new system? Contact the Multimedia Tech team at
        <a href="mailto:multimediatech@theguardian.com">multimediatech@theguardian.com</a>
    </div>
</div>
</body>
</html>
